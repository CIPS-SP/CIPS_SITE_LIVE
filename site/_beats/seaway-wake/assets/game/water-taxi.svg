<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 100" width="48" height="100">
  <!-- Water Taxi CI: a 12 m cabin RIB in plan, bow up — fat grey tubes with an orange fender line, white deck, the console amidships,
       a clear deck aft where the operator's mark goes (dropped in by the game from assets/game/logos/, along the boat), twin outboards.
       Original drawing (HLC lab, 18 Sep 2026). -->
  <defs><linearGradient id="tube" x1="0" x2="1"><stop offset="0" stop-color="#5b636b"/><stop offset=".5" stop-color="#8b949c"/><stop offset="1" stop-color="#4d555d"/></linearGradient></defs>
  <!-- outboards -->
  <g fill="#23292e"><rect x="12" y="90" width="8" height="9" rx="2"/><rect x="28" y="90" width="8" height="9" rx="2"/></g>
  <!-- tubes -->
  <path d="M24 2 C 36 14, 44 34, 44 60 L 44 86 C 44 92, 40 95, 34 95 L 14 95 C 8 95, 4 92, 4 86 L 4 60 C 4 34, 12 14, 24 2 Z" fill="url(#tube)"/>
  <path d="M24 8 C 33 18, 39 36, 39 60 L 39 84 C 39 88, 36 90, 32 90 L 16 90 C 12 90, 9 88, 9 84 L 9 60 C 9 36, 15 18, 24 8 Z" fill="none" stroke="#f08a24" stroke-width="1.6"/>
  <!-- deck -->
  <path d="M24 12 C 31 22, 36 38, 36 60 L 36 84 C 36 87, 34 88, 31 88 L 17 88 C 14 88, 12 87, 12 84 L 12 60 C 12 38, 17 22, 24 12 Z" fill="#f4f5f3"/>
  <!-- foredeck hatch, the console with its screen, the seats -->
  <rect x="19" y="20" width="10" height="7" rx="2" fill="#dfe3e6" stroke="#b7bec4" stroke-width=".8"/>
  <rect x="15" y="34" width="18" height="16" rx="3" fill="#e3e7ea" stroke="#9aa19d" stroke-width="1"/><rect x="17" y="36" width="14" height="5" rx="1.5" fill="#26343f"/>
  <g fill="#1c63b7"><rect x="14" y="54" width="20" height="4" rx="2"/><rect x="14" y="61" width="20" height="4" rx="2"/></g>
  <!-- the stern platform -->
  <rect x="14" y="83" width="20" height="4" rx="1.5" fill="#cfd5d9"/>
</svg>
