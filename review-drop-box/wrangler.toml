# Cloudflare settings for the CIPS review drop box. See README.md "Putting it live".
name = "cips-review-drop-box"
main = "src/worker.js"
compatibility_date = "2025-09-01"
# Don't send wrangler's anonymous usage reports to Cloudflare.
send_metrics = false

[vars]
# Website addresses allowed to post answers and read the approved list (comma separated).
# 5 Nov 2026: the live site on Cloudflare Pages (cipslive.pages.dev) and, ready for go-live, cips.agency with and without www.
ALLOWED_ORIGINS = "https://cipslive.pages.dev,https://cips.agency,https://www.cips.agency"

# The review page, for the full link the box hands back when the Desk makes a short link (…/review/?kinship-7KQ4M2XD).
# Change to https://cips.agency/review/ when the site moves there.
REVIEW_PAGE = "https://cipslive.pages.dev/review/"

# Website enquiries (7 Nov 2026): who the email to dutyagent@cips.agency is from (a domain verified in Resend), and how many
# minutes an enquiry may go without a "delivered" report from Resend before the alert goes out.
MAIL_FROM = "CIPS website <website@send.cips.agency>"
ALERT_AFTER_MIN = "60"

# Every 5 minutes: resend enquiries whose email failed, and raise the alert for any not confirmed delivered.
[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "BOX"
id = "2c88883b101e4edfaac53006ad8c7465"   # KV namespace "BOX", created 5 Nov 2026 on Simon@cips.agency's Account

# Secrets are NOT kept here. Set them with:
#   wrangler secret put SIGNING_SECRET
#   wrangler secret put COLLECT_SECRET
#   wrangler secret put RESEND_API_KEY          (a Resend key with "sending access" only, for the one domain)
#   wrangler secret put RESEND_WEBHOOK_SECRET   (whsec_..., from the webhook set up in Resend)
#   wrangler secret put ALERT_URL               (where the "not delivered" alert is posted, e.g. a private ntfy topic)
