<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <!-- La Corbière as she is (Howard's photographs, 18 Sep 2026): an all-white concrete tower with a gentle taper, standing on a broad
       flared plinth; two small square windows one above the other on the seaward face; the gallery with its white railing; the
       lantern — white base, a glazed drum with vertical astragals, a WHITE dome — and the aerial on top; the little white service
       building with its stair up to the door at the foot of the tower; all on the brown granite rock, the causeway below.
       1874, Sir John Coode: the first concrete lighthouse in the British Isles. Stood up on the map like a marker. An original drawing. -->
  <defs>
    <linearGradient id="tw" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f4f3ef"/><stop offset="1" stop-color="#c8c5bd"/></linearGradient>
    <linearGradient id="rk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a06f47"/><stop offset=".5" stop-color="#7a5236"/><stop offset="1" stop-color="#4f3521"/></linearGradient>
    <radialGradient id="lamp"><stop offset="0" stop-color="#fff9d6"/><stop offset=".6" stop-color="#ffd27a"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- the rock -->
  <path d="M6 136 L 10 124 L 16 118 L 14 110 L 24 106 L 30 98 L 38 100 L 44 92 L 52 92 L 58 88 L 66 90 L 74 86 L 82 92 L 88 90 L 96 100 L 100 98 L 106 110 L 112 114 L 116 136 Z" fill="url(#rk)"/>
  <g fill="#3a2614" opacity=".35"><path d="M16 118 L 24 106 L 30 112 Z"/><path d="M44 92 L 52 92 L 48 100 Z"/><path d="M88 90 L 96 100 L 86 98 Z"/><path d="M100 98 L 106 110 L 96 108 Z"/></g>
  <g fill="#c98f5f" opacity=".35"><path d="M24 106 L 30 98 L 38 100 L 32 108 Z"/><path d="M66 90 L 74 86 L 82 92 L 72 94 Z"/></g>
  <path d="M30 104 L 44 98 L 58 96 L 74 98 L 90 104" fill="none" stroke="#3a2614" stroke-width="1.2" opacity=".55"/>
  <path d="M40 120 L 52 104 L 62 106 L 50 124 Z" fill="#6a4a30" opacity=".7"/>
  <!-- the causeway and the service building with its stair -->
  <path d="M2 138 L 40 112" stroke="#d9d2c4" stroke-width="3" fill="none"/>
  <rect x="26" y="98" width="16" height="10" fill="#f6f5f1" stroke="#b9b3a5" stroke-width=".8"/><rect x="26" y="96" width="16" height="2.5" fill="#8e8b84"/>
  <path d="M42 100 L 54 90" stroke="#e8e6e0" stroke-width="2.4" fill="none"/><path d="M42 100 L 54 90" stroke="#9c9789" stroke-width=".6" stroke-dasharray="1.5 1.5" fill="none"/>
  <!-- the plinth and the tower -->
  <path d="M50 92 L 54 84 L 82 84 L 86 92 Z" fill="#ecebe6"/>
  <path d="M50 92 L 54 84 L 82 84 L 86 92 Z" fill="#ecebe6"/>
  <path d="M55 84 L 60 30 L 76 30 L 81 84 Z" fill="url(#tw)"/>
  <rect x="53" y="83" width="30" height="2.5" fill="#dcdad3"/>
  <!-- the door at the foot, and the two small square windows on the face -->
  <rect x="66" y="74" width="4.5" height="9" rx=".6" fill="#26343f"/>
  <rect x="66.2" y="56" width="3.6" height="3.6" fill="#26343f"/><rect x="66.6" y="42" width="3.2" height="3.2" fill="#26343f"/>
  <!-- the gallery: a white platform with its railing -->
  <rect x="54" y="28.5" width="28" height="3" rx=".8" fill="#f3f2ee" stroke="#c8c5bd" stroke-width=".6"/>
  <g stroke="#e8e6e0" stroke-width=".9"><line x1="55.5" y1="23.5" x2="55.5" y2="28.5"/><line x1="59" y1="23.5" x2="59" y2="28.5"/><line x1="63" y1="23.5" x2="63" y2="28.5"/><line x1="68" y1="23.5" x2="68" y2="28.5"/><line x1="73" y1="23.5" x2="73" y2="28.5"/><line x1="77" y1="23.5" x2="77" y2="28.5"/><line x1="80.5" y1="23.5" x2="80.5" y2="28.5"/></g>
  <rect x="54.5" y="23" width="27" height="1.2" fill="#e8e6e0"/>
  <!-- the lantern: white base, the glazed drum with its astragals, the white dome, the aerial -->
  <rect x="59" y="22" width="18" height="6" fill="#f6f5f1" stroke="#c8c5bd" stroke-width=".6"/>
  <rect x="60" y="11" width="16" height="11" fill="#cfe0ea" stroke="#9fb1bb" stroke-width=".8"/>
  <g stroke="#f6f5f1" stroke-width="1.1"><line x1="64" y1="11" x2="64" y2="22"/><line x1="68" y1="11" x2="68" y2="22"/><line x1="72" y1="11" x2="72" y2="22"/></g>
  <path d="M59 11 C 59 4, 77 4, 77 11 Z" fill="#f6f5f1" stroke="#c8c5bd" stroke-width=".6"/>
  <line x1="68" y1="5" x2="68" y2="0" stroke="#8e8b84" stroke-width="1"/><line x1="65" y1="2" x2="71" y2="2" stroke="#8e8b84" stroke-width=".8"/>
  <!-- the lamp -->
  <circle class="lamp" cx="68" cy="16.5" r="9" fill="url(#lamp)"/>
</svg>
