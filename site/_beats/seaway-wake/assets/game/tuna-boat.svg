<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 200" width="150" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- plan view of a small tuna troller, heading up: white hull, blue gunwale, wheelhouse forward, two outrigger poles out, lines astern. Original drawing. -->
  <defs>
    <linearGradient id="dk" x1="0" x2="1"><stop offset="0" stop-color="#d9dcd6"/><stop offset=".5" stop-color="#f4f4f0"/><stop offset="1" stop-color="#d9dcd6"/></linearGradient>
  </defs>
  <!-- trolling lines astern with floats -->
  <g stroke="#e8f2f5" stroke-width="1" opacity=".75" fill="none">
    <path d="M62 150 L 40 196"/><path d="M88 150 L 110 196"/><path d="M70 150 L 66 198"/><path d="M80 150 L 84 198"/>
  </g>
  <g fill="#ff7a1a"><circle cx="41" cy="194" r="2.4"/><circle cx="109" cy="194" r="2.4"/><circle cx="66" cy="197" r="1.8"/><circle cx="84" cy="197" r="1.8"/></g>
  <!-- outrigger poles -->
  <g stroke="#3c3c3c" stroke-width="2.2" stroke-linecap="round">
    <line x1="75" y1="78" x2="6" y2="40"/><line x1="75" y1="78" x2="144" y2="40"/>
  </g>
  <!-- hull -->
  <path d="M75 4 C 90 24, 98 60, 98 100 L 98 146 C 98 150, 95 152, 91 152 L 59 152 C 55 152, 52 150, 52 146 L 52 100 C 52 60, 60 24, 75 4 Z" fill="#1d5fa3"/>
  <path d="M75 12 C 87 30, 93 62, 93 100 L 93 143 C 93 146, 91 147, 88 147 L 62 147 C 59 147, 57 146, 57 143 L 57 100 C 57 62, 63 30, 75 12 Z" fill="url(#dk)"/>
  <!-- foredeck hatch, wheelhouse, mast, aft deck gear -->
  <rect x="68" y="30" width="14" height="10" rx="2" fill="#c7ccc8"/>
  <rect x="61" y="52" width="28" height="30" rx="3" fill="#e9ecea" stroke="#9aa19d" stroke-width="1"/>
  <rect x="64" y="55" width="22" height="6" rx="1.5" fill="#2b3a44"/>
  <circle cx="75" cy="78" r="3.2" fill="#3c3c3c"/>
  <rect x="61" y="96" width="10" height="10" rx="1.5" fill="#bfc6c2"/><rect x="79" y="96" width="10" height="10" rx="1.5" fill="#bfc6c2"/>
  <rect x="61" y="110" width="10" height="10" rx="1.5" fill="#bfc6c2"/><rect x="79" y="110" width="10" height="10" rx="1.5" fill="#bfc6c2"/>
  <rect x="60" y="128" width="30" height="4" rx="2" fill="#5a6166"/>
  <!-- small figure on the aft deck -->
  <circle cx="75" cy="124" r="2.6" fill="#f2b64a"/>
</svg>
